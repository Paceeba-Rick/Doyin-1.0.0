<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#001a33"/>
  
  <!-- Doyin Logo - Cyan D with lines -->
  <g transform="translate(50, 50)">
    <!-- Left lines -->
    <rect x="0" y="20" width="25" height="8" rx="4" fill="#00d4ff"/>
    <rect x="0" y="35" width="20" height="8" rx="4" fill="#00d4ff"/>
    <rect x="0" y="50" width="15" height="8" rx="4" fill="#00d4ff"/>
    
    <!-- Large D -->
    <path d="M 35 15 L 35 85 Q 35 95 45 95 L 55 95 Q 75 95 75 55 Q 75 35 55 15 L 35 15" 
          fill="none" stroke="#00d4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
